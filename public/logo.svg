<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="inflowOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faa335"/>
      <stop offset="40%" stop-color="#f6871e"/>
      <stop offset="100%" stop-color="#eb630e"/>
    </linearGradient>

    <!-- Deep Teal -->
    <linearGradient id="inflowTealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f4f54"/>
      <stop offset="100%" stop-color="#09383c"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 1. ORANGE FLOWING CALLIGRAPHY FLOURISH ('f')                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="orange-flourish">
    <!-- Feathered brush wisps at the top-left of the flow -->
    <path d="M 98 64 C 104 52 115 42 130 34 C 122 41 114 51 108 61 Z" fill="url(#inflowOrangeGrad)"/>
    <path d="M 102 60 C 110 46 125 35 144 26 C 132 34 120 48 112 60 Z" fill="url(#inflowOrangeGrad)"/>
    <path d="M 108 56 C 118 40 138 27 160 20 C 146 28 128 42 118 56 Z" fill="url(#inflowOrangeGrad)"/>

    <!-- Main Dynamic 'f' Flow Ribbon (Filled Path for exact curvature) -->
    <!-- Top arch loops up and right, stem descends down, with crossbar branch and bottom curl -->
    <path d="
      M 102 62
      C 114 36, 140 20, 172 20
      C 202 20, 224 35, 230 60
      C 234 78, 225 96, 212 112
      L 236 108
      C 244 106, 250 112, 248 120
      C 246 128, 238 132, 228 132
      L 202 134
      C 192 154, 180 178, 164 194
      C 152 206, 138 210, 126 202
      C 118 196, 116 186, 124 178
      C 132 170, 144 172, 148 180
      C 150 184, 148 190, 142 192
      C 136 194, 132 190, 134 186
      C 134 184, 138 184, 138 186
      C 146 174, 160 148, 174 120
      C 162 108, 154 94, 150 82
      C 142 56, 154 38, 172 38
      C 188 38, 204 48, 204 64
      C 204 74, 196 86, 184 98
      C 176 80, 160 64, 142 50
      C 126 50, 112 56, 102 62
      Z" 
      fill="url(#inflowOrangeGrad)" />

    <!-- Pure Calligraphic Vector Ribbon Body with organic stroke caps -->
    <!-- Left curve from tip to apex -->
    <path d="M 100 64 C 112 36, 142 22, 172 22 C 210 22, 236 44, 232 78 C 228 108, 208 148, 184 182 C 172 198, 154 212, 134 206 C 122 202, 118 188, 126 180 C 134 172, 146 174, 150 184" 
          stroke="url(#inflowOrangeGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Crossbar of 'f' -->
    <path d="M 204 116 C 220 114, 236 112, 246 110" 
          stroke="url(#inflowOrangeGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Subtle inner white dynamic hairline for fluid depth -->
    <path d="M 132 192 C 146 196, 162 186, 172 170 C 182 152, 194 130, 200 110" 
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 2. TEAL FOUNTAIN PEN NIB                                        -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="pen-nib">
    <!-- Nib Body Blade -->
    <path d="
      M 98 64
      L 126 104
      C 124 120, 118 134, 116 144
      L 76 144
      C 74 134, 68 120, 66 104
      Z" 
      fill="url(#inflowTealGrad)" />

    <!-- Center Slit Line & Circular Breather Hole -->
    <path d="
      M 96.5 64
      L 96.5 102
      A 5 5 0 1 0 99.5 102
      L 99.5 64
      Z" 
      fill="#ffffff" />

    <!-- Base Arched Cutout -->
    <path d="M 76 145 Q 96 138 116 145 L 116 143 Q 96 136 76 143 Z" fill="#ffffff" />

    <!-- Pen Collar / Base Ring -->
    <rect x="72" y="150" width="48" height="14" rx="7" fill="url(#inflowTealGrad)" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 3. "Inflow" WORDMARK TYPOGRAPHY                                 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="wordmark" fill="#0b4348">
    <text x="160" y="265" 
          font-family="system-ui, -apple-system, 'Inter', 'Geist', 'Plus Jakarta Sans', sans-serif" 
          font-size="68" 
          font-weight="800" 
          text-anchor="middle" 
          letter-spacing="-1px"
          fill="#0b4348">Inflow</text>
  </g>
</svg>

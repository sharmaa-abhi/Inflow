<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" fill="none">
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="wm-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="wm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon badge -->
  <rect x="0" y="2" width="28" height="28" rx="7" fill="url(#wm-bg)"/>
  <!-- Shine overlay -->
  <rect x="0" y="2" width="28" height="14" rx="7" fill="url(#wm-shine)"/>

  <!-- Pen nib shape inside badge -->
  <!-- Nib body -->
  <path d="M14 5 L21 13 L14 27 L7 13 Z" fill="white" fill-opacity="0.12"/>
  <!-- Left facet -->
  <path d="M14 5 L7 13 L14 19 Z" fill="white" fill-opacity="0.3"/>
  <!-- Right facet -->
  <path d="M14 5 L21 13 L14 19 Z" fill="white" fill-opacity="0.55"/>
  <!-- Center slit -->
  <line x1="14" y1="15" x2="14" y2="27" stroke="white" stroke-width="0.8" stroke-opacity="0.45" stroke-linecap="round"/>
  <!-- Ink drop at tip -->
  <ellipse cx="14" cy="26.5" rx="1.8" ry="2.3" fill="white" fill-opacity="0.92" filter="url(#wm-glow)"/>
  <!-- Speed arcs -->
  <path d="M10 8 Q7 11 8 15" stroke="white" stroke-width="0.9" stroke-opacity="0.4" fill="none" stroke-linecap="round"/>
  <path d="M18 8 Q21 11 20 15" stroke="white" stroke-width="0.9" stroke-opacity="0.4" fill="none" stroke-linecap="round"/>

  <!-- Wordmark text: "Ink" bold + "Flow" lighter -->
  <!-- "Ink" -->
  <text x="33" y="22" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1e293b" letter-spacing="-0.3">Ink</text>
  <!-- "Flow" in indigo -->
  <text x="55" y="22" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#6366f1" letter-spacing="-0.3">Flow</text>
</svg>

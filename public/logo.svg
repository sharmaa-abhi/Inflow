<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="inkflowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="inkflowSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Ribbon Flow Gradient -->
    <linearGradient id="inkflowRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="inkflowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glass Shimmer -->
  <rect width="64" height="64" rx="16" fill="url(#inkflowBgGrad)" filter="url(#softDropShadow)"/>
  
  <!-- Subtle inner border stroke for premium glass aesthetic -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" fill="none"/>

  <!-- Background Flowing Infinity Wave Ribbon -->
  <path d="M12 36 C12 24, 24 20, 32 30 C40 40, 52 36, 52 24 C52 14, 40 16, 32 24" 
        stroke="url(#inkflowRibbonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" fill="none"/>

  <!-- Foreground Flowing Wave Ribbon -->
  <path d="M12 40 C14 26, 26 24, 32 32 C38 40, 50 38, 52 28" 
        stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" fill="none"/>

  <!-- Master Pen Nib Geometry -->
  <!-- Upper Nib Crown -->
  <path d="M32 10 L44 26 C44 33, 40 38, 32 50 C24 38, 20 33, 20 26 Z" 
        fill="white" fill-opacity="0.95" filter="url(#softDropShadow)"/>

  <!-- Left Facet Shade for 3D depth -->
  <path d="M32 10 L20 26 C20 33, 24 38, 32 50 Z" 
        fill="#e0e7ff" fill-opacity="0.6"/>

  <!-- Right Facet Highlight -->
  <path d="M32 10 L44 26 C44 33, 40 38, 32 50 Z" 
        fill="#ffffff" fill-opacity="0.95"/>

  <!-- Center Slit Line -->
  <line x1="32" y1="26" x2="32" y2="48" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Breather Hole in Center of Nib -->
  <circle cx="32" cy="26" r="2.6" fill="#4f46e5"/>

  <!-- Radiant Glowing Ink Drop at the Nib Tip -->
  <circle cx="32" cy="50" r="3.2" fill="url(#inkflowSparkGrad)" filter="url(#inkflowGlow)"/>

  <!-- Top Right Creativity Sparkle Star -->
  <path d="M48 12 Q48 16 52 16 Q48 16 48 20 Q48 16 44 16 Q48 16 48 12 Z" 
        fill="#ffffff" opacity="0.95"/>
</svg>

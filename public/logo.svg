<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="inflowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faa234"/>
      <stop offset="35%" stop-color="#f6861e"/>
      <stop offset="100%" stop-color="#eb630e"/>
    </linearGradient>

    <!-- Deep Brand Teal -->
    <linearGradient id="inflowTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f4e53"/>
      <stop offset="100%" stop-color="#09373b"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 1. ORANGE FLOWING CALLIGRAPHY FLOURISH ('f' / Ribbon)           -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="orange-flourish">
    <!-- Feathered brush wisps at the pen nib tip -->
    <path d="M 112 76 C 118 62 130 50 148 40 C 140 48 130 60 122 72 Z" fill="url(#inflowOrange)"/>
    <path d="M 116 72 C 126 56 142 42 165 32 C 152 42 136 58 126 72 Z" fill="url(#inflowOrange)"/>
    <path d="M 122 68 C 136 48 158 34 186 24 C 170 36 148 52 134 70 Z" fill="url(#inflowOrange)"/>

    <!-- Single Continuous Elegant Ribbon ('f' form) -->
    <path d="
      M 114 74
      C 126 44, 158 24, 202 24
      C 252 24, 286 52, 284 94
      C 282 120, 268 138, 252 152
      L 278 144
      C 288 140, 296 148, 292 158
      C 288 166, 278 170, 264 172
      L 238 174
      C 222 208, 198 248, 164 256
      C 142 260, 124 248, 126 230
      C 128 216, 142 208, 156 214
      C 168 220, 172 232, 164 240
      C 158 246, 150 244, 146 238
      C 144 234, 148 230, 152 232
      C 154 234, 152 238, 148 236
      C 164 236, 184 212, 202 174
      C 192 158, 182 138, 180 118
      C 176 86, 192 60, 214 54
      C 236 48, 254 62, 254 84
      C 254 104, 240 128, 224 148
      C 214 130, 200 106, 182 86
      C 160 62, 134 66, 114 74
      Z" 
      fill="url(#inflowOrange)" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 2. TEAL FOUNTAIN PEN NIB                                        -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="pen-nib">
    <!-- Nib Body Blade -->
    <path d="
      M 112 76
      L 144 122
      C 142 140, 135 156, 132 168
      L 86 168
      C 83 156, 76 140, 74 122
      Z" 
      fill="url(#inflowTeal)" />

    <!-- Center Slit & Circular Breather Hole -->
    <path d="
      M 110.5 76
      L 110.5 120
      A 6 6 0 1 0 113.5 120
      L 113.5 76
      Z" 
      fill="#ffffff" />

    <!-- Nib Base Arched Cutout -->
    <path d="M 86 169 Q 109 161 132 169 L 132 167 Q 109 159 86 167 Z" fill="#ffffff" />

    <!-- Grip Collar / Pen Ring -->
    <rect x="81" y="176" width="56" height="17" rx="8.5" fill="url(#inflowTeal)" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 3. "Inflow" WORDMARK                                            -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g id="wordmark" fill="#0b4348">
    <text x="180" y="306" 
          font-family="system-ui, -apple-system, 'Inter', 'Geist', 'Plus Jakarta Sans', sans-serif" 
          font-size="78" 
          font-weight="800" 
          text-anchor="middle" 
          letter-spacing="-1.5px"
          fill="#0b4348">Inflow</text>
  </g>
</svg>

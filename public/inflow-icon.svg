<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Inflow Brand Orange Gradient -->
    <linearGradient id="iconOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca132"/>
      <stop offset="30%" stop-color="#f8891d"/>
      <stop offset="100%" stop-color="#ea640c"/>
    </linearGradient>

    <!-- Inflow Brand Teal -->
    <linearGradient id="iconTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#125359"/>
      <stop offset="100%" stop-color="#0a393e"/>
    </linearGradient>
  </defs>

  <!-- Centered Icon Mark -->
  <g transform="translate(10, 10) scale(0.92)">
    <!-- 1. ORANGE FLOURISH -->
    <g id="orange-flourish">
      <!-- Brush Wisps -->
      <path d="M 120 85 C 126 72 136 60 152 48 C 146 54 138 65 132 76 Z" fill="url(#iconOrange)"/>
      <path d="M 124 82 C 132 66 148 52 168 42 C 158 50 144 65 136 78 Z" fill="url(#iconOrange)"/>
      <path d="M 129 78 C 140 60 162 45 186 36 C 172 45 152 61 142 76 Z" fill="url(#iconOrange)"/>

      <!-- Main Ribbon Body -->
      <path d="
        M 122 84
        C 136 56, 172 32, 214 32
        C 272 32, 308 60, 308 102
        C 308 114, 298 120, 288 118
        C 274 116, 258 104, 244 92
        C 242 106, 246 122, 258 130
        C 268 136, 286 134, 300 128
        C 308 124, 316 130, 314 140
        C 312 148, 302 154, 290 156
        C 264 160, 248 150, 236 136
        C 222 170, 204 212, 172 230
        C 150 242, 122 242, 106 228
        C 90 214, 90 192, 102 178
        C 114 164, 132 164, 142 174
        C 152 182, 154 194, 148 202
        C 142 210, 130 212, 124 206
        C 120 202, 120 198, 124 194
        C 128 190, 134 192, 136 196
        C 134 200, 130 202, 126 200
        C 120 196, 120 186, 128 180
        C 142 168, 168 176, 180 196
        C 198 178, 212 138, 218 98
        C 200 84, 178 72, 152 72
        C 134 72, 122 80, 114 90
        Z" 
        fill="url(#iconOrange)" />

      <!-- Inner white sweep detail -->
      <path d="M 195 174 C 198 184 194 206 182 218 C 178 222 172 220 174 214 C 182 202 188 186 186 176 Z" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- 2. TEAL PEN NIB -->
    <g id="pen-nib">
      <!-- Nib Body -->
      <path d="
        M 120 90
        L 155 140
        C 153 158, 146 172, 144 182
        L 96 182
        C 94 172, 87 158, 85 140
        Z" 
        fill="url(#iconTeal)" />

      <!-- Breather Hole & Slit -->
      <path d="
        M 118.5 90
        L 118.5 134
        A 6 6 0 1 0 121.5 134
        L 121.5 90
        Z" 
        fill="#ffffff" />

      <!-- Nib Base Cutout Arch -->
      <path d="M 95 183 Q 120 176 145 183 L 145 181 Q 120 174 95 181 Z" fill="#ffffff" />

      <!-- Pen Collar -->
      <rect x="91" y="189" width="58" height="16" rx="8" fill="url(#iconTeal)" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Orange Gradient for the flowing ribbon -->
    <linearGradient id="inflowOrange" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#f98e2b"/>
      <stop offset="50%" stop-color="#f37c1e"/>
      <stop offset="100%" stop-color="#ea6310"/>
    </linearGradient>

    <!-- Deep Teal for the pen nib and typography -->
    <linearGradient id="inflowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4b50"/>
      <stop offset="100%" stop-color="#0a393e"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM GROUP (Mark) -->
  <g id="logo-mark" transform="translate(0, 0)">
    <!-- 1. ORANGE FLOWING FLOURISH / INK RIBBON ('f' shape) -->
    <!-- Bristle Wisps / Tapered Feathers originating from pen nib tip -->
    <path d="M 148 108 C 158 92 178 72 208 55 C 200 63 186 78 174 94 Z" fill="url(#inflowOrange)"/>
    <path d="M 156 102 C 172 82 200 60 236 44 C 220 56 198 78 184 98 Z" fill="url(#inflowOrange)"/>
    
    <!-- Main Bold Flow Ribbon -->
    <path d="
      M 160 102
      C 185 68, 222 42, 275 42
      C 340 42, 385 75, 385 130
      C 385 142, 375 152, 362 152
      C 348 152, 328 135, 310 118
      C 310 135, 316 160, 355 160
      C 368 160, 375 168, 372 178
      C 368 190, 350 196, 332 196
      C 305 196, 290 178, 285 150
      C 275 195, 255 242, 225 260
      C 205 272, 178 275, 160 262
      C 142 248, 140 226, 150 210
      C 160 194, 180 192, 192 202
      C 202 210, 204 224, 198 232
      C 192 240, 180 242, 175 238
      C 172 235, 172 230, 176 226
      C 180 222, 186 225, 186 228
      C 184 235, 176 238, 170 235
      C 160 228, 160 215, 172 205
      C 188 192, 218 200, 230 222
      C 248 205, 264 165, 272 120
      C 255 105, 230 92, 200 92
      C 178 92, 160 102, 148 112
      Z" 
      fill="url(#inflowOrange)" />

    <!-- 2. TEAL FOUNTAIN PEN NIB -->
    <g transform="translate(138, 185) rotate(-14) translate(-138, -185)">
      <!-- Pen Nib Body -->
      <path d="
        M 138 65
        L 175 130
        C 173 150, 165 170, 168 190
        L 108 190
        C 111 170, 103 150, 101 130
        Z" 
        fill="url(#inflowTeal)" />

      <!-- Center Breather Hole & Slit (Negative Space Cutout) -->
      <path d="
        M 136.5 65
        L 136.5 130
        A 8 8 0 1 0 139.5 130
        L 139.5 65
        Z" 
        fill="#ffffff" />
      
      <!-- Inner Nib Base Arch Cutout -->
      <path d="
        M 108 190
        Q 138 180 168 190
        L 168 195
        Q 138 185 108 195
        Z"
        fill="#ffffff" />

      <!-- Pen Nib Collar / Ring Band at bottom -->
      <rect x="104" y="200" width="68" height="18" rx="9" fill="url(#inflowTeal)" />
    </g>
  </g>

  <!-- 3. "Inflow" WORDMARK TYPOGRAPHY -->
  <g fill="#0e4b50" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800">
    <text x="250" y="380" font-size="96" text-anchor="middle" letter-spacing="-2px">Inflow</text>
  </g>
</svg>

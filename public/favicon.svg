<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="nibGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#logoGrad)"/>

  <!-- Pen nib (main icon) -->
  <!-- Nib body - diamond/chevron shape -->
  <path d="M24 8 L34 20 L24 40 L14 20 Z" fill="white" fill-opacity="0.15"/>

  <!-- Nib left facet -->
  <path d="M24 8 L14 20 L24 28 Z" fill="white" fill-opacity="0.35"/>

  <!-- Nib right facet -->
  <path d="M24 8 L34 20 L24 28 Z" fill="white" fill-opacity="0.55"/>

  <!-- Nib slit (center line) -->
  <line x1="24" y1="20" x2="24" y2="40" stroke="white" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Ink drop at tip -->
  <ellipse cx="24" cy="39" rx="2.5" ry="3.5" fill="white" fill-opacity="0.9" filter="url(#glow)"/>

  <!-- Flow arc lines (speed lines coming off the nib) -->
  <path d="M18 14 Q12 18 14 24" stroke="white" stroke-width="1.2" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M30 14 Q36 18 34 24" stroke="white" stroke-width="1.2" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
</svg>
